name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on tags like v1.0.0, v1.2.3, etc.

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # A tag can be pushed long after a newer one exists - backfilling a release
  # that was never tagged, for one. Publishing it would move `latest` backwards
  # onto older code for every deployment that follows that tag.
  guard:
    runs-on: ubuntu-latest
    outputs:
      newest: ${{ steps.check.outputs.newest }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Refuse to publish anything but the newest tag
      id: check
      run: |
        newest="$(git tag -l 'v*.*.*' | sort -V | tail -1)"
        if [ "$GITHUB_REF_NAME" = "$newest" ]; then
          echo "newest=true" >> "$GITHUB_OUTPUT"
        else
          echo "newest=false" >> "$GITHUB_OUTPUT"
          echo "::notice::$GITHUB_REF_NAME is not the newest tag ($newest), nothing is published"
        fi

  build:
    needs: guard
    if: needs.guard.outputs.newest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./deploy/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}