# Separated namespace
apiVersion: v1
kind: Namespace
metadata:
  name: fckloud-controller
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    
---
# ServiceAccount for the operator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fckloud-controller
  namespace: fckloud-controller
automountServiceAccountToken: true

---
# ClusterRole with minimal permissions for node status management
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fckloud-controller
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["nodes/status"]
  verbs: ["patch", "update"]

---
# ClusterRoleBinding to grant permissions to ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fckloud-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fckloud-controller
subjects:
- kind: ServiceAccount
  name: fckloud-controller
  namespace: fckloud-controller

---
# DaemonSet ensures exactly one replica per node
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fckloud-controller
  namespace: fckloud-controller
  labels:
    app.kubernetes.io/name: fckloud-controller
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fckloud-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fckloud-controller
    spec:
      serviceAccountName: fckloud-controller
      hostNetwork: true # Host network access for networking stack access
      
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      
      containers:
      - name: fckloud-controller
        image: ghcr.io/inaneverb/fckloud:latest
        
        # Security context for container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        
        env:
        - name: FCKLOUD_NODE # The node this controller should manage
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        # Pinned on purpose: a version set never changes, so upgrading the image
        # cannot add a provider and with it a host this node has to be allowed
        # to reach. Move it deliberately, after reading what the newer set asks.
        - name: FCKLOUD_PROVIDERS
          value: "v1.10"

        - name: FCKLOUD_JSON # Enable logs in JSON?
          value: "false"
        # How long an ExternalIP consensus stopped vouching for is left alone.
        # It also takes two well answered rounds, so a single round nobody could
        # corroborate never costs the node an address. "never" keeps them all.
        - name: FCKLOUD_REMOVAL_GRACE
          value: "5m"

        # OpenTelemetry is configured by its own standard variables, not by
        # FCKLOUD_ ones, so that a collector sidecar or the OpenTelemetry
        # Operator can inject them the way they already do everywhere else.
        #
        # Nothing is exported until an endpoint is set. There is no assumed
        # address: these pods are on the host's network, where a guessed port
        # belongs to whatever else is listening on it.
        #
        # Uncomment and point at your collector to turn it on. Set
        # OTEL_TRACES_EXPORTER or OTEL_METRICS_EXPORTER to "none" for one
        # signal without the other, or OTEL_SDK_DISABLED to "true" for neither.
        #- name: OTEL_EXPORTER_OTLP_ENDPOINT
        #  value: "http://opentelemetry-collector.observability.svc:4318"

        - name: POD_NAME # Only feeds the resource attributes below
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "k8s.node.name=$(FCKLOUD_NODE),k8s.pod.name=$(POD_NAME),k8s.namespace.name=fckloud-controller"

        # Resource limits
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      
      # Tolerations to run on all nodes including control plane (comment if needed)
      # https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane

---